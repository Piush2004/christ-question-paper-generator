services:
  - type: web
    name: question-paper-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 0 wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.5
      - key: OLLAMA_HOST
        sync: false   # set to a reachable Ollama server's URL for live generation; omit for showcase mode
    # NOTE: Render's free plan (512MB RAM) is tight for this app's ML stack
    # (sentence-transformers -> torch) and cannot run Ollama itself. The app
    # still deploys and serves the browsing/dataset/status pages; live
    # generation needs OLLAMA_HOST pointed at a server with enough RAM and a
    # pulled model (self-hosted, a small VPS, or a paid plan with more memory).
