[project]
name = "question-paper-ai"
version = "0.1.0"
description = "Curriculum-aware, constraint-controlled question-paper intelligence system (research project, Christ University)."
requires-python = ">=3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length handled by formatter/reviewer judgment, not a hard gate yet
    "UP046",  # pydantic generic models use typing.Generic[T], not PEP 695 type params (pydantic 2.13
              # generics are documented/tested against Generic[T]; switching is a compatibility risk
              # for zero benefit, see src/schemas/question.py AnnotationProvenance)
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
